<form method="post" action="{% url 'main:toggle_star_educations' educations.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in educations.starred_by.all %} is-starred{% endif %}"
            title="{% if educations.starred_by.all %}Dibintangi oleh {{ educations.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in educations.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ educations.starred_by.count }}</span>
    </button>
</form>
