<div id="global-delete-skill-modal"
     class="project-delete-modal skill-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="global-delete-skill-title">
    
    <button type="button"
            class="project-delete-modal__backdrop skill-delete-modal__backdrop"
            popovertarget="global-delete-skill-modal"
            popovertargetaction="hide"
            onclick="closeDeleteSkillModal()"
            aria-label="Tutup konfirmasi hapus"></button>

    <div class="project-delete-modal__content skill-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close skill-delete-modal__close"
                popovertarget="global-delete-skill-modal"
                popovertargetaction="hide"
                onclick="closeDeleteSkillModal()"
                aria-label="Tutup konfirmasi hapus">×</button>

        <h2 id="global-delete-skill-title">Hapus Skill?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong id="global-delete-skill-name">skill ini</strong>?
        </p>

        <div class="project-delete-modal__actions skill-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="global-delete-skill-modal"
                    popovertargetaction="hide"
                    onclick="closeDeleteSkillModal()">Batal</button>

            <form id="global-delete-skill-form" onsubmit="executeDeleteSkillAjax(event)">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
