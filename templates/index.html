{% extends "base.html" %}
{% block meta %}
    <title>Main - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information System &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/FotoFaruq.jpg" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Sesi Terakhir Login</dt>
                            <dd>{{ last_login }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/SuruuriIsyaAlfaruq2" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/suruuri-isya-alfaruq-5436b637b" class="social-link">LinkedIn</a>
                        <a href="mailto:suruurialfaruq@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>

    </main>

{% endblock content %}
